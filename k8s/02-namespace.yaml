apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-part1
  labels:
    app: backend
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: backend
    template:
      metadata:
        labels:
          app: backend
          spec:
            containers:
              - name: backend
                image: backend:local
                imagePullPolicy: IfNotPresent
                ports:
                  - containerPort: 1000
                volumeMounts:
                  - name: mongo-data
                    mountPath: /data/db
                volumes: 
                  - name: mongo-data
                    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
   name: mongo
   namespace: devops-part1
spec:
  selector: 
     app: mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP