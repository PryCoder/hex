apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops-part1
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1000
          env:
            - name: PORT
              value: "1000"

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-part1
spec:
  selector:
    app: backend
  ports:
    - port: 1000
      targetPort: 1000
  type: ClusterIP
