name: build-and-test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- NODE SETUP ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            se/package-lock.json
            clie/package-lock.json

      # ---------------- BACKEND ----------------
      - name: Install backend dependencies
        working-directory: se
        run: npm ci

      - name: Lint backend
        working-directory: se
        run: npm run lint

      # ---------------- FRONTEND ----------------
      - name: Install frontend dependencies
        working-directory: clie
        run: npm ci

      - name: Lint frontend
        working-directory: clie
        run: npm run lint

      # ---------------- DOCKER ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t myapp-backend ./se

      - name: Build frontend Docker image
        run: docker build -t myapp-frontend ./clie

  deploy:
    needs: build-and-lint
    if: github.event.name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH key
        run: |
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            set -e
            cd "${EC2_APP_DIR}" || exit 1
            # Fetch latest code
            git fetch --all
            git reset --hard origin/main
            # Rebuild containers
            docker compose up -d --build
            # Clean old images
            docker image prune -f
            docker compose ps
          EOF
