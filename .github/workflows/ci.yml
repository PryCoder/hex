name : build-and-test
#triggers: define when the workflow will run
#trigger on push to these branches
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main,dev]

#define the jobs to run
jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

      - name: Install frontend dependencies
        run: npm ci
      
      - name: Lint frontend
        working-directory: clie
        run: npm ci

      - name: Build backend image
        run: docker build -t backend ./se
      
      - name: Build frontend image
        run: docker build -t frontend ./clie