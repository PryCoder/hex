name: build-and-test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------- NODE SETUP ----------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            se/package-lock.json
            clie/package-lock.json

      # ---------------- BACKEND ----------------
      - name: Install backend dependencies
        working-directory: se
        run: npm ci

      - name: Lint backend
        working-directory: se
        run: npm run lint

      # ---------------- FRONTEND ----------------
      - name: Install frontend dependencies
        working-directory: clie
        run: npm ci

      - name: Lint frontend
        working-directory: clie
        run: npm run lint

      # ---------------- DOCKER ----------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: docker build -t myapp-backend ./se

      - name: Build frontend Docker image
        run: docker build -t myapp-frontend ./clie
