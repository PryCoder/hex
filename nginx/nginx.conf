# Nginx ko batata hai ki event handling kaise hogi
events {}

http {
    # Max request body size (file upload ya test payload ke liye)
    client_max_body_size 10M;

    server {
        # Nginx port 80 pe sunega (public access)
        listen 80;

        # ================= FRONTEND =================
        # Jab koi / ya homepage hit kare
        # Request frontend (Vite dev server) ko forward ho jayegi
        location / {
            proxy_pass http://frontend:5173;   # Docker service name + port
            proxy_http_version 1.1;            # Vite ke liye required
            proxy_set_header Upgrade $http_upgrade;   # WebSocket support
            proxy_set_header Connection "upgrade";    # WebSocket support
            proxy_set_header Host $host;        # Original host preserve
            proxy_set_header X-Real-IP $remote_addr;  # Client ka real IP
            proxy_set_header X-Forwarded-Proto $scheme; # http / https
            proxy_buffering off;                # Live reload ke liye
        }

        # ================= BACKEND API =================
        # /api/* wali sari requests backend service ko jayengi
        location /api/ {
            proxy_pass http://backend:1000/;   # Backend container
            proxy_set_header Host $host;        # Original host
            proxy_set_header X-Real-IP $remote_addr;  # Client IP
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
            # Puri IP chain (load balancer + client)
            proxy_set_header X-Forwarded-Proto $scheme; # http / https
            proxy_connect_timeout 5s;           # Backend connect timeout
            proxy_send_timeout 60s;              # Request send timeout
            proxy_read_timeout 60s;              # Response read timeout
        }

        # ================= HEALTH CHECK =================
        # Simple endpoint to check nginx alive hai ya nahi
        location = /nginx-health {
            return 200 "nginx is healthy";
            add_header Content-Type text/plain;
        }
    }
}
