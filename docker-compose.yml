version: "3.9"

services:
  backend:
    build: ./se
    container_name: backend
    restart: always
    env_file:
      - ./se/.env
    expose:
      - "1000"
    depends_on:
      - redis
    networks:
      - app-network

  frontend:
    build:
      context: ./clie
      args:
        VITE_API_URL: /api
    container_name: frontend
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./favicon.ico:/usr/share/nginx/html/favicon.ico
    networks:
      - app-network

  redis:
    image: redis/redis-stack
    container_name: redis-stack
    expose:
      - "6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
