version: "3.9"

services:
  backend:
    build: ./se
    container_name: backend
    restart: always
    env_file:
      - ./se/.env
    expose:
      - "1000"
    depends_on:
      - redis
      - mongo
    networks:
      - app-network

  frontend:
    build:
      context: ./clie
      args:
        VITE_API_URL: /api
    container_name: frontend
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    expose:
      - "6379"
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
